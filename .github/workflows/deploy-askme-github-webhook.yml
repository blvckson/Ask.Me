name: Deploy Ask.Me GitHub Webhook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/github-webhook/**"
      - ".github/workflows/deploy-askme-github-webhook.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Configure webhook secret
        env:
          ASKME_GITHUB_WEBHOOK_SECRET: ${{ secrets.ASKME_GITHUB_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$ASKME_GITHUB_WEBHOOK_SECRET"
          printf '%s' "$ASKME_GITHUB_WEBHOOK_SECRET" | wrangler secret put GITHUB_WEBHOOK_SECRET --config workers/github-webhook/wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config workers/github-webhook/wrangler.toml
